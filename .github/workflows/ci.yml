name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal e2e web/embed.go)"
      - name: Vet
        run: go vet -tags e2e ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: go build -o bin/heimdall ./cmd/heimdall
